name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # No `environment: { name: github-pages }` block here on purpose: that
    # environment's default branch-restriction setting only allows the
    # repo's default branch to deploy, and the default branch is still the
    # old feature-branch name (a repo-admin-only setting, not fixable by
    # any available tool) rather than main. With the block present, every
    # push here failed with "Branch 'main' is not allowed to deploy to
    # github-pages due to environment protection rules" -- confirmed from
    # the actual GitHub API error, not assumed. This is a workaround, not
    # the root-cause fix: once a repo admin allows `main` under Settings ->
    # Environments -> github-pages -> Deployment branches and tags (or
    # switches the actual default branch to main), the environment block
    # can be reinstated to restore deployment protection.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
