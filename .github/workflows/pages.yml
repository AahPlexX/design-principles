name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # The site is built from source now, so the filter has to cover everything the build reads.
    # A filter that still only watched docs/** would mean content and template changes deployed
    # nothing, silently — the failure mode being no failure at all, just a stale site.
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the sitemap dates each URL from the last commit that touched the content
          # module behind it. At depth 1 every page would claim the date of this deploy.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and prerender
        run: npm run build

      # Cheap insurance against deploying a broken URL surface. CI covers this on the pull request, but
      # this workflow can also be dispatched manually against a branch that never had one, and a
      # renamed page is not recoverable once it is live — GitHub Pages has no redirects.
      - name: Verify the URL surface before publishing
        run: npx tsx scripts/gates/url-parity.ts

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # dist/client, not dist: dist/server holds the SSR bundle the prerenderer imports, which is
          # build machinery and has no business being served.
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # No `environment: github-pages` block here on purpose: that environment's deployment-branch
    # policy has never included `main` (a repo setting no available tool here can change), and
    # declaring the environment makes GitHub Actions enforce that policy before the job runs at all --
    # it fails in under 2 seconds with no logs, before deploy-pages ever gets to execute. Omitting the
    # block skips that enforcement entirely; the only cost is no auto-populated environment badge/URL
    # in the repo's UI, which doesn't affect the actual deployment.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
