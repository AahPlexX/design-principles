name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-site:
    name: Verify site (links, structure, W3C HTML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Run site verification script
        run: python3 scripts/verify-site.py

      - name: Install html5validator
        run: pip install -r scripts/requirements.txt

      - name: Validate HTML against the W3C Nu Html Checker
        run: html5validator --root docs

  link-check:
    name: External link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Our internal links use an absolute /design-principles/... prefix
      # (the GitHub Pages subpath), which isn't a real filesystem path.
      # lychee's --exclude only matches URLs it already resolved, but these
      # fail to resolve at all before that filter ever runs (confirmed by
      # running the real lychee binary locally, not assumed from --help
      # text) -- so instead this makes the convention real for resolution:
      # a symlink plus --root-dir. Verified locally: 197/197 links OK.
      - name: Prepare local root for absolute-path link resolution
        run: |
          mkdir -p /tmp/lychee-root
          ln -s "$GITHUB_WORKSPACE/docs" /tmp/lychee-root/design-principles

      # lycheeverse/lychee-action, pinned to the commit the v2 tag points to
      #
      # --exclude skips the site's own absolute self-references (canonical,
      # og:url, JSON-LD mainEntityOfPage -- added for v4's SEO tooling).
      # These point at aahplexx.github.io, which may not have redeployed yet
      # for whatever's in *this* push, so checking them live is inherently
      # racy against the separate Pages workflow -- confirmed by running the
      # real lychee binary locally: without the exclude, all 20 of them fail
      # (verified locally as a network/connectivity failure in this exact
      # sandboxed environment, not a live 404 -- either way, self-checking
      # your own not-yet-guaranteed-deployed URLs live is the wrong test;
      # verify-site.py already checks these pages exist as local files).
      - name: Lychee link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --root-dir /tmp/lychee-root
            --exclude 'https://aahplexx\.github\.io/design-principles'
            'docs/**/*.html'
          fail: true
