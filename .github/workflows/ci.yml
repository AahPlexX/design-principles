name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-site:
    name: Verify site (links, structure, W3C HTML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Run site verification script
        run: python3 scripts/verify-site.py

      - name: Install html5validator
        run: pip install -r scripts/requirements.txt

      - name: Validate HTML against the W3C Nu Html Checker
        run: html5validator --root docs

  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # super-linter/super-linter, pinned to the commit for the v8.7.0 release
      - name: Super-linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          # Super-Linter rejects mixing VALIDATE_ALL_CODEBASE with explicit
          # per-linter true/false overrides (confirmed via a failed CI run,
          # not assumed), so this is an opt-in whitelist instead: everything
          # not listed here simply doesn't run.
          VALIDATE_HTML: true
          VALIDATE_CSS: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_GITHUB_ACTIONS: true
          # One modern linter instead of stacking pylint/flake8/black/isort,
          # which would otherwise report overlapping, sometimes-conflicting findings.
          VALIDATE_PYTHON_RUFF: true

  link-check:
    name: External link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # lycheeverse/lychee-action, pinned to the commit the v2 tag points to
      - name: Lychee link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # --exclude skips our own root-relative internal links (already
          # covered by scripts/verify-site.py) *before* lychee tries to
          # resolve them as filesystem paths, which otherwise errors --
          # confirmed via a failed CI run: --scheme alone does not prevent
          # that resolution attempt. --scheme stays as defense in depth.
          args: >-
            --no-progress
            --exclude '^/design-principles'
            --scheme https,http
            'docs/**/*.html'
          fail: true
