name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-site:
    name: Verify site (links, structure, W3C HTML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Run site verification script
        run: python3 scripts/verify-site.py

      - name: Install html5validator
        run: pip install -r scripts/requirements.txt

      - name: Validate HTML against the W3C Nu Html Checker
        run: html5validator --root docs

  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Super-Linter posts a per-linter commit status via the GitHub API;
      # the workflow-level contents:read-only token got a 403 doing this
      # (confirmed via a failed CI run, not assumed).
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # super-linter/super-linter, pinned to the commit for the v8.7.0 release
      - name: Super-linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          # Super-Linter rejects mixing VALIDATE_ALL_CODEBASE with explicit
          # per-linter true/false overrides (confirmed via a failed CI run,
          # not assumed), so this is an opt-in whitelist instead: everything
          # not listed here simply doesn't run.
          VALIDATE_HTML: true
          VALIDATE_CSS: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_GITHUB_ACTIONS: true
          # One modern linter instead of stacking pylint/flake8/black/isort,
          # which would otherwise report overlapping, sometimes-conflicting findings.
          VALIDATE_PYTHON_RUFF: true

  link-check:
    name: External link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Our internal links use an absolute /design-principles/... prefix
      # (the GitHub Pages subpath), which isn't a real filesystem path.
      # lychee's --exclude only matches URLs it already resolved, but these
      # fail to resolve at all before that filter ever runs (confirmed by
      # running the real lychee binary locally, not assumed from --help
      # text) -- so instead this makes the convention real for resolution:
      # a symlink plus --root-dir. Verified locally: 197/197 links OK.
      - name: Prepare local root for absolute-path link resolution
        run: |
          mkdir -p /tmp/lychee-root
          ln -s "$GITHUB_WORKSPACE/docs" /tmp/lychee-root/design-principles

      # lycheeverse/lychee-action, pinned to the commit the v2 tag points to
      - name: Lychee link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --root-dir /tmp/lychee-root
            'docs/**/*.html'
          fail: true
